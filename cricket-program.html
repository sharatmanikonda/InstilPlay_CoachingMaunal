<meta charset="utf-8">
<title>Bat &amp; Field Foundations</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#F5F4EE; --backdrop:#E6E4D8; --surface:#FFFFFF; --surface-2:#EFEEE4;
    --ink:#1B2621; --ink-soft:#4A554E; --ink-faint:#6F7A72;
    --border:#E0DFD3; --border-strong:#CBCABB;
    --red:#B23A2E; --red-soft:#F2E1DD; --red-ink:#8E2C22;
    --green:#2E6E4E; --green-soft:#E1EDE5;
    --gold:#9A6B12; --gold-soft:#F4EAD2;
    --blue:#35607F; --blue-soft:#E0E9F0;
    --turf:#1F4A36; --turf-ink:#F5F4EE; --turf-faint:#A9C3B4;
    --skin:#C98F63; --bat:#D9B77E; --grass:#E4EEDD; --grass-line:#9DBE9F;
    --shadow:0 1px 2px rgba(27,38,33,.05),0 8px 24px rgba(27,38,33,.07);
    --display:"Zilla Slab",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --paper:#131C18; --backdrop:#0D1411; --surface:#1A241F; --surface-2:#212D27;
      --ink:#EBEAE1; --ink-soft:#B4BDB5; --ink-faint:#8A948C;
      --border:#2A362F; --border-strong:#3A473E;
      --red:#DB5C4F; --red-soft:#33211E; --red-ink:#E9776B;
      --green:#5CA87D; --green-soft:#1C2B22;
      --gold:#D2A24A; --gold-soft:#2E2615;
      --blue:#7FA8C6; --blue-soft:#1B2630;
      --turf:#18291F; --turf-ink:#EBEAE1; --turf-faint:#8FAE9C;
      --skin:#B98059; --bat:#C9A66C; --grass:#1C2B21; --grass-line:#3D5A45;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#131C18; --backdrop:#0D1411; --surface:#1A241F; --surface-2:#212D27;
    --ink:#EBEAE1; --ink-soft:#B4BDB5; --ink-faint:#8A948C;
    --border:#2A362F; --border-strong:#3A473E;
    --red:#DB5C4F; --red-soft:#33211E; --red-ink:#E9776B;
    --green:#5CA87D; --green-soft:#1C2B22;
    --gold:#D2A24A; --gold-soft:#2E2615;
    --blue:#7FA8C6; --blue-soft:#1B2630;
    --turf:#18291F; --turf-ink:#EBEAE1; --turf-faint:#8FAE9C;
    --skin:#B98059; --bat:#C9A66C; --grass:#1C2B21; --grass-line:#3D5A45;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--backdrop);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .app{max-width:440px;margin:0 auto;min-height:100%;background:var(--paper);position:relative;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  @media (min-width:520px){.app{box-shadow:0 0 0 1px var(--border),0 20px 60px rgba(0,0,0,.12)}}

  /* header */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--turf);color:var(--turf-ink);padding:12px 16px 12px}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand svg{flex:none}
  .brand b{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.1;display:block}
  .brand small{display:block;font-size:11px;color:var(--turf-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;flex:none}
  .seg button{border:0;background:transparent;color:var(--turf-faint);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--turf-ink);color:var(--turf)}

  /* bottom nav */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);z-index:30;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--ink-faint);border-radius:10px}
  .nav button[aria-current="page"]{color:var(--red-ink)}
  .nav svg{width:22px;height:22px}

  .screen{padding:16px 16px 24px;display:flex;flex-direction:column;gap:18px}
  h2.sec{font-family:var(--display);font-size:19px;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.005em}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .sec-head span{font-size:12px;color:var(--ink-faint)}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .muted{color:var(--ink-soft)}
  .faint{color:var(--ink-faint)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px}
  .pad{padding:14px}

  /* hero */
  .hero{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .hero h1{font-family:var(--display);font-size:26px;line-height:1.1;margin:2px 0 0;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
  .meta{display:flex;flex-wrap:wrap;gap:6px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);font-weight:500;white-space:nowrap}
  .outcome{background:var(--green-soft);border-radius:12px;padding:10px 12px;font-size:14px}
  .outcome b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:2px}

  /* timer */
  .timer{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--turf);color:var(--turf-ink);border-radius:16px}
  .timer-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .clock{flex:none;white-space:nowrap;font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1}
  .clock small{font-size:14px;color:var(--turf-faint)}
  .now{font-size:13px;color:var(--turf-faint);min-width:0}
  .now b{color:var(--turf-ink);display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;display:flex;gap:2px}
  .bar i{display:block;height:100%;background:rgba(255,255,255,.2)}
  .bar i.done{background:var(--turf-ink)}
  .bar i.live{background:linear-gradient(90deg,var(--turf-ink) var(--p),rgba(255,255,255,.2) var(--p))}
  .btns{display:flex;gap:8px}
  .btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;background:var(--red);color:#fff}
  .btn.ghost{background:rgba(255,255,255,.12);color:var(--turf-ink)}
  .btn.line{background:transparent;border:1px solid var(--border-strong);color:var(--ink)}
  .btn.small{padding:6px 11px;font-size:13px}

  /* checklist */
  .check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--border);font-size:14px}
  .check:first-child{border-top:0}
  .check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--green);flex:none}
  .check label{flex:1;cursor:pointer}
  .check small{display:block;color:var(--ink-faint);font-size:12px}
  .done-count{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}

  details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
  details.fold>summary::-webkit-details-marker{display:none}
  .chev{transition:transform .2s;color:var(--ink-faint);flex:none}
  details[open]>summary .chev{transform:rotate(90deg)}

  /* timeline */
  .tl{display:flex;flex-direction:column}
  .blk{display:grid;grid-template-columns:46px 1fr;gap:10px;position:relative}
  .blk .t{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);padding-top:14px;text-align:right}
  .blk .body{border-left:2px solid var(--border);padding:10px 0 10px 14px;position:relative;min-width:0}
  .blk .body::before{content:"";position:absolute;left:-6px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--k,var(--ink-faint))}
  .blk.live .body::before{background:var(--k)}
  .blk.past .t{text-decoration:line-through}
  .blk-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .blk.live .blk-card{border-color:var(--k);box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 18%,transparent)}
  .blk-card>summary{padding:11px 12px;align-items:flex-start}
  .blk-title{font-weight:600;font-size:15px;line-height:1.3}
  .blk-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
  .kind{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--k);background:var(--ks);padding:2px 7px;border-radius:5px}
  .dur{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
  .livetag{font-size:11px;font-weight:700;color:#fff;background:var(--red);padding:2px 7px;border-radius:5px;letter-spacing:.04em}
  .blk-in{padding:0 12px 12px;display:flex;flex-direction:column;gap:12px;font-size:14px}
  .k-warm{--k:var(--gold);--ks:var(--gold-soft)}
  .k-bat{--k:var(--red);--ks:var(--red-soft)}
  .k-field{--k:var(--green);--ks:var(--green-soft)}
  .k-game{--k:var(--blue);--ks:var(--blue-soft)}
  .k-admin{--k:var(--ink-faint);--ks:var(--surface-2)}
  .cues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .cues li{padding-left:16px;position:relative}
  .cues li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--k,var(--red))}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
  .ask{font-style:italic;color:var(--ink-soft)}
  .ref{font-size:12px;color:var(--ink-faint)}
  .ref b{font-weight:500;color:var(--ink-soft)}

  .drill{border:1px solid var(--border);border-radius:10px;background:var(--paper)}
  .drill>summary{padding:9px 11px}
  .drill-no{font-family:var(--mono);font-size:11.5px;color:var(--k,var(--red-ink));font-weight:500}
  .drill-name{font-weight:600;font-size:14px}
  .drill-in{padding:0 11px 11px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
  .drill-in ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
  .adj{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .adj div{background:var(--surface-2);border-radius:8px;padding:7px 9px;font-size:12.5px}
  .adj b{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}

  .rot{width:100%;border-collapse:collapse;font-size:13px}
  .rot th,.rot td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--border)}
  .rot th{font-size:11px;color:var(--ink-faint);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .rot td.mono{color:var(--ink-faint)}

  /* roster */
  .roster{display:flex;flex-direction:column}
  .pl{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
  .pl:first-child{border-top:0}
  .att{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-strong);background:transparent;display:grid;place-items:center;padding:0}
  .att[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
  .pl-name{font-size:14px;font-weight:500;min-width:0}
  .pl-name small{display:block;font-size:11.5px;color:var(--ink-faint);font-weight:400}
  .rates{display:flex;gap:4px}
  .rate{width:30px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);font-family:var(--mono);font-size:12px;font-weight:500;padding:0;color:var(--ink-faint)}
  .rate.r1{background:var(--red-soft);color:var(--red-ink);border-color:transparent}
  .rate.r2{background:var(--gold-soft);color:var(--gold);border-color:transparent}
  .rate.r3{background:var(--green-soft);color:var(--green);border-color:transparent}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-faint)}
  .rate-heads{display:grid;grid-template-columns:28px 1fr auto;gap:10px;font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-bottom:4px}
  .rate-heads .rates span{width:30px;text-align:center}
  textarea{width:100%;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);padding:10px;resize:vertical;min-height:84px;font-size:14px}
  .input{width:100%;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);padding:10px;font-size:14px}
  .example{font-size:11px;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:2px 7px;border-radius:5px;letter-spacing:.03em}

  /* student */
  .kid-hero{background:var(--turf);color:var(--turf-ink);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
  .kid-hero h1{font-family:var(--display);font-size:28px;line-height:1.08;margin:0;font-weight:700;letter-spacing:-.015em;text-wrap:balance;max-width:15ch}
  .kid-hero .eyebrow{color:var(--turf-faint)}
  .kid-hero svg.ball{position:absolute;right:-26px;top:-20px;width:130px;height:130px;opacity:.9}
  .prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--turf-faint)}
  .prog .track{flex:1;height:6px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
  .prog .track i{display:block;height:100%;background:var(--turf-ink)}
  .cuecards{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
  .cue{scroll-snap-align:start;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--ks);border:1px solid color-mix(in srgb,var(--k) 25%,transparent)}
  .cue .eyebrow{color:var(--k)}
  .cue q{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;quotes:none;color:var(--ink)}
  .cue p{margin:0;font-size:13.5px;color:var(--ink-soft)}
  .kstep{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
  .kstep:first-child{border-top:0}
  .kstep .t{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);padding-top:1px}
  .kstep b{display:block;font-size:14.5px}
  .kstep span{font-size:13.5px;color:var(--ink-soft)}
  .score{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
  .score:first-child{border-top:0}
  .score div{min-width:0}
  .score b{display:block;font-size:14.5px;font-weight:600}
  .score small{font-size:12px;color:var(--ink-faint)}
  .stepper{display:flex;align-items:center;gap:4px;flex:none}
  .stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);font-size:18px;line-height:1;padding:0}
  .stepper output{min-width:48px;text-align:center;font-family:var(--mono);font-size:16px;font-weight:500}
  .feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .feel button{border:1px solid var(--border-strong);background:var(--surface);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600}
  .feel button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
  .feel svg{width:28px;height:28px}
  .badge{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;border:1.5px dashed var(--border-strong);background:var(--surface)}
  .badge.on{border-style:solid;border-color:var(--gold);background:var(--gold-soft)}
  .badge svg{flex:none;width:56px;height:56px}
  .badge b{font-family:var(--display);font-size:18px;display:block}
  .badge span{font-size:13px;color:var(--ink-soft)}

  /* program */
  .road{display:grid;grid-template-columns:repeat(26,1fr);gap:2px;margin-top:6px}
  .road i{height:26px;border-radius:3px;background:var(--surface-2)}
  .road i.cur{background:var(--red)}
  .road i.p2{background:color-mix(in srgb,var(--gold) 45%,var(--surface-2))}
  .road i.p3{background:color-mix(in srgb,var(--green) 45%,var(--surface-2))}
  .road i.p4{background:color-mix(in srgb,var(--blue) 45%,var(--surface-2))}
  .road-lbl{display:grid;grid-template-columns:repeat(4,auto);gap:8px;margin-top:10px}
  .phase{font-size:12px;line-height:1.3}
  .phase b{display:block;font-size:12.5px}
  .phase .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
  .months{display:grid;grid-template-columns:repeat(6,1fr);font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:4px}
  .wk{background:var(--surface);border:1px solid var(--border);border-radius:14px}
  .wk.cur{border-color:var(--red)}
  .wk>summary{padding:12px 14px;align-items:flex-start}
  .wk-no{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
  .wk-title{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2;margin-top:1px}
  .load{display:flex;gap:3px;margin-top:6px;align-items:center;font-size:11px;color:var(--ink-faint)}
  .load i{width:14px;height:4px;border-radius:2px;background:var(--border)}
  .load i.on{background:var(--ink-soft)}
  .wk-in{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
  .two{display:grid;grid-template-columns:1fr;gap:10px}
  .strand{border-radius:10px;padding:10px 12px;background:var(--ks)}
  .strand .lbl{color:var(--k)}
  .strand ul{margin:0;padding-left:16px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
  .strand .dr{margin-top:6px;font-size:12.5px;color:var(--ink-soft)}
  .days{display:flex;flex-direction:column;gap:6px}
  .day{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:var(--surface-2);font-size:13.5px;border:0;text-align:left;width:100%}
  .day b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--ink-faint);margin-right:6px}
  .day.go{background:var(--red);color:#fff}
  .day.go b{color:rgba(255,255,255,.75)}
  .mile{font-size:13px;display:flex;gap:8px;align-items:flex-start;color:var(--ink-soft)}
  .mile svg{flex:none;margin-top:2px;color:var(--gold)}

  /* syllabus */
  .cov{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cov .card{padding:12px}
  .cov .big{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
  .cov .big small{font-size:15px;color:var(--ink-faint);font-weight:500}
  .meter{height:5px;border-radius:9px;background:var(--surface-2);margin-top:8px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--k)}
  .part{background:var(--surface);border:1px solid var(--border);border-radius:14px}
  .part>summary{padding:12px 14px}

const easeIO = u => u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;
function lerpV(a, b, u){
  if (typeof a === "number") return typeof b === "number" ? a + (b - a) * u : a;
  if (Array.isArray(a)) return a.map((x, i) => lerpV(x, b ? b[i] : x, u));
  if (a && typeof a === "object"){ const o = {}; for (const k in a) o[k] = b && k in b ? lerpV(a[k], b[k], u) : a[k]; return o; }
  return a;
}
function sampleKeys(keys, t, linear){
  if (t <= keys[0].t) return keys[0];
  for (let i = 0; i < keys.length - 1; i++){
    const a = keys[i], b = keys[i + 1];
    if (t <= b.t){ const u = b.t === a.t ? 1 : (t - a.t) / (b.t - a.t); return lerpV(a, b, linear ? u : easeIO(u)); }
  }
  return keys[keys.length - 1];
}
const fill = keys => { let prev = { o: 1 }; return keys.map(k => (prev = { ...prev, ...k })); };
const sh = (p, dx, dy = 0) => Object.fromEntries(Object.entries(p).map(([k, [x, y]]) => [k, [x + dx, y + dy]]));
const reduceMotion = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){ return false; } })();

function Figure({ p, bat }){
  const L = (a, b) => html`<line x1=${p[a][0]} y1=${p[a][1]} x2=${p[b][0]} y2=${p[b][1]}/>`;
  let batEl = null;
  if (bat != null){
    const cx = (p.bh[0] + p.fh[0]) / 2, cy = (p.bh[1] + p.fh[1]) / 2, r = bat * Math.PI / 180, dx = Math.cos(r), dy = Math.sin(r);
    batEl = html`<g stroke-linecap="round"><line x1=${cx - dx*7} y1=${cy - dy*7} x2=${cx + dx*8} y2=${cy + dy*8} stroke="var(--ink-soft)" stroke-width="3"/><line x1=${cx + dx*9} y1=${cy + dy*9} x2=${cx + dx*42} y2=${cy + dy*42} stroke="var(--bat)" stroke-width="7"/></g>`;
  }
  const limb = { stroke:"var(--ink)", "stroke-width":6, "stroke-linecap":"round", "stroke-linejoin":"round", fill:"none" };
  return html`<g>
    <g ...${limb} opacity=".45">${L("neck","be")}${L("be","bh")}${L("hip","bk")}${L("bk","bf")}</g>
    <g ...${limb}>${L("neck","hip")}${L("hip","fk")}${L("fk","ff")}</g>
    ${batEl}
    <g ...${limb}>${L("neck","fe")}${L("fe","fh")}</g>
    <circle cx=${p.head[0]} cy=${p.head[1]} r="9" fill="var(--ink)"/>
    <circle cx=${p.bh[0]} cy=${p.bh[1]} r="3.4" fill="var(--skin)"/><circle cx=${p.fh[0]} cy=${p.fh[1]} r="3.4" fill="var(--skin)"/>
  </g>`;
}

function ActionPlayer({ spec, onWatched, autoPlay = true }){
  const [t, setT] = useState(reduceMotion ? spec.rest || 0 : 0);
  const [playing, setPlaying] = useState(autoPlay && !reduceMotion);
  const [slow, setSlow] = useState(false);
  const ref = useRef(null), acc = useRef(0), fired = useRef(false), cb = useRef(onWatched);
  cb.current = onWatched;
  useEffect(() => { setT(reduceMotion ? spec.rest || 0 : 0); acc.current = 0; fired.current = false; }, [spec.id]);
  useEffect(() => {
    if (!playing) return;
    let raf, last = performance.now(), vis = true;
    const io = new IntersectionObserver(([e]) => { vis = e.isIntersecting; });
    if (ref.current) io.observe(ref.current);
    const tick = now => {
      const dt = Math.min(.1, (now - last) / 1000) * (slow ? .35 : 1); last = now;
      if (vis){
        setT(x => (x + dt) % spec.dur);
        acc.current += dt;
        if (!fired.current && acc.current >= spec.dur){ fired.current = true; cb.current && cb.current(spec.id); }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(raf); io.disconnect(); };
  }, [playing, slow, spec]);
  const fig = spec.figure && sampleKeys(spec.figure, t);
  const ci = spec.captions.reduce((a, c, i) => c.t <= t ? i : a, 0);
  return html`<div class="anim" ref=${ref}>
    <svg viewBox="0 0 240 160" role="img" aria-label=${spec.title + ". " + spec.captions.map(c => c.text).join(". ")}>
      ${spec.ground && html`<g><rect width="240" height="160" fill="var(--surface-2)"/><rect y="140" width="240" height="20" fill="var(--grass)"/><line x1="0" y1="140" x2="240" y2="140" stroke="var(--grass-line)" stroke-width="1.5"/></g>`}
      ${spec.bg && spec.bg()}
      ${fig && html`<${Figure} p=${fig.p} bat=${fig.bat}/>`}
      ${spec.items.map((it, i) => html`<g key=${i}>${it.draw(sampleKeys(it.keys, t, it.linear))}</g>`)}
    </svg>
    <div class="anim-cap">
      <button class="icon-btn" onClick=${() => setPlaying(p => !p)} aria-label=${playing ? "Pause" : "Play"}>
        ${playing ? html`<svg width="14" height="14" viewBox="0 0 14 14"><rect x="3" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="8" y="2" width="3" height="10" rx="1" fill="currentColor"/></svg>`
                  : html`<svg width="14" height="14" viewBox="0 0 14 14"><path d="M4 2.5v9l7.5-4.5z" fill="currentColor"/></svg>`}
      </button>
      <p>${spec.captions[ci].text}</p>
      <button class="slow" aria-pressed=${slow ? "true" : "false"} onClick=${() => { setSlow(s => !s); setPlaying(true); }}>Slow-mo</button>
    </div>
    <div class="phases">${spec.captions.map((c, i) => html`<button key=${i} class=${i <= ci ? "on" : ""} aria-label=${"Jump to: " + c.text} onClick=${() => { setPlaying(false); setT(c.t + .02); }}></button>`)}</div>
  </div>`;
}

function useStudent(){
  const [kit, setKit] = useStored("kit", [true, true, true, false, false]);
  const [done, setDone] = useStored("done", { b1:true, b2:true });
  const [scores, setScores] = useStored("scores", { s1:6, s2:0, s3:0, s4:0 });
  const [feel, setFeel] = useStored("feel", 0);
  const [learned, setLearned] = useStored("learned", "");
  const [home, setHome] = useStored("home", { h1:false, h2:false });
  const [watched, setWatched] = useStored("watched", { drive:true });
  const s = { kit, done, scores, feel, learned, home, watched };
  const badges = BADGES.map(b => ({ ...b, on: b.test(s) }));
  const quests = QUESTS.map(q => { const [v, max] = q.prog(s); return { ...q, v, max, on: v >= max }; });
  const xp = kit.filter(Boolean).length * 5 + count(done) * 15 + Object.values(scores).reduce((a, b) => a + b, 0) * 2
    + (feel ? 10 : 0) + (learned.trim() ? 15 : 0) + count(home) * 30 + count(watched) * 10
    + quests.filter(q => q.on).reduce((a, q) => a + q.xp, 0) + badges.filter(b => b.on).length * 25;
  const li = LEVELS.reduce((a, l, i) => xp >= l[0] ? i : a, 0);
  const next = LEVELS[li + 1];
  return { ...s, setKit, setDone, setScores, setFeel, setLearned, setHome, setWatched, badges, quests, xp, level: li + 1, levelName: LEVELS[li][1],
    pct: next ? (xp - LEVELS[li][0]) / (next[0] - LEVELS[li][0]) * 100 : 100, toNext: next ? next[0] - xp : 0, nextName: next ? next[1] : null,
    streak: count(done) >= 8 ? 1 : 0, watch: id => setWatched(w => w[id] ? w : { ...w, [id]: true }) };
}

function indexSyllabus(data){
  const byId = {};
  (function walk(n, part, chapter){
    if (!n) return;
    byId[n.id] = { ...n, part, chapter };
    const p = n.type === "part" ? n : part;
    const c = (n.type === "chapter" || n.type === "appendix") ? n : chapter;
    (n.children || []).forEach(ch => walk(ch, p, c));
    (n.topics || []).forEach(t => walk(t, p, c));
  })(data.root, null, null);
  return byId;
}

/* ---------- student: journey map ---------- */
function Journey({ st, goToday }){
  const [sel, setSel] = useState(0);
  const X = [60, 160, 260];
  const nodes = [];
  WEEKS.forEach((w, r) => w.days.forEach((d, c) => nodes.push({ i: r * 3 + c, w, c, x: r % 2 === 0 ? X[c] : X[2 - c], y: 50 + r * 92, title: d })));
  let path = `M${nodes[0].x} ${nodes[0].y}`;
  for (let i = 1; i < nodes.length; i++){
    const a = nodes[i - 1], b = nodes[i];
    if (a.y === b.y) path += ` L${b.x} ${b.y}`;
    else { const out = a.x > 160 ? 48 : -48; path += ` C${a.x + out} ${a.y} ${b.x + out} ${b.y} ${b.x} ${b.y}`; }
  }
  const complete = count(st.done) >= 8;
  const H = 50 + 7 * 92 + 44;
  const glyph = ["M12 3v5 M10 8h4l-.5 12h-3z", "M12 6.5a5.5 5.5 0 1 0 .01 0 M9 8.5q3 3.5 0 7 M15 8.5q-3 3.5 0 7", "M8 5h8v4a4 4 0 0 1-8 0z M12 13v4 M9 19h6"];
  const cur = nodes[sel];
  const stateOf = n => n.i === 0 ? (complete ? "done" : "now") : n.i === 1 && complete ? "next" : "locked";

  return html`<div class="screen">
    <section class="hero">
      <div class="eyebrow">Your journey · 24 sessions</div>
      <h1>Bat & Field Foundations</h1>
      <p class="note" style=${{ margin:0 }}>Clear each session to unlock the next. Flags mark a week's milestone; the trophy nodes are game days.</p>
    </section>

    <section class="card pad" style=${{ position:"sticky", top:"calc(env(safe-area-inset-top, 0px) + 66px)", zIndex:5, boxShadow:"var(--shadow)" }}>
      <div class="eyebrow">Week ${cur.w.n} · Day ${cur.c + 1}${cur.c === 2 ? " · Game day" : ""}</div>
      <h2 class="sec" style=${{ margin:"3px 0 6px" }}>${cur.title}</h2>
      ${cur.i === 0
        ? html`<div style=${{ display:"flex", gap:10, alignItems:"center", justifyContent:"space-between" }}><span class="note">${complete ? "Cleared! Every block ticked." : count(st.done) + "/8 blocks ticked today"}</span><button class="btn small" onClick=${goToday}>Open today</button></div>`
        : html`<span class="note">${stateOf(cur) === "next" ? "Up next at your following session." : "Locked. Clear the sessions before it to unlock."} Milestone: ${cur.w.milestone}.</span>`}
    </section>

    <section class="card pad journey">
      <svg viewBox=${`0 0 320 ${H}`} role="group" aria-label="Session map">
        <path d=${path} fill="none" stroke="var(--border-strong)" stroke-width="5" stroke-dasharray="1 10" stroke-linecap="round"/>
        ${complete && html`<path d=${`M${nodes[0].x} ${nodes[0].y} L${nodes[1].x} ${nodes[1].y}`} stroke="var(--gold)" stroke-width="5" stroke-linecap="round"/>`}
        ${WEEKS.map((w, r) => html`<text key=${w.n} x="160" y=${50 + r * 92 - 30} text-anchor="middle" class="jlbl">Week ${w.n} · ${w.title}</text>`)}
        ${WEEKS.map((w, r) => { const x = r % 2 === 0 ? 300 : 20, y = 50 + r * 92 + (r < 7 ? 46 : 0); const fx = r < 7 ? x : (r % 2 === 0 ? 296 : 24);
          return html`<g key=${"f" + r} transform=${`translate(${fx - 9} ${(r < 7 ? y : 50 + r * 92) - 9})`}><circle cx="9" cy="9" r="10" fill="var(--gold-soft)" stroke="var(--gold)"/><path d="M6.5 4v10 M6.5 4.5h6l-1.6 2.3 1.6 2.3h-6" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-linejoin="round"/></g>`; })}
        ${nodes.map(n => {
          const s = stateOf(n);
          const face = s === "now" ? "var(--red)" : s === "done" ? "var(--gold)" : s === "next" ? "var(--surface)" : "var(--surface-2)";
          const ink = s === "now" || s === "done" ? "#fff" : s === "next" ? "var(--red)" : "var(--ink-faint)";
          return html`<g key=${n.i} class="jnode" role="button" tabIndex="0" aria-label=${`Week ${n.w.n} day ${n.c + 1}: ${n.title} (${s})`}
              onClick=${() => setSel(n.i)} onKeyDown=${e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); setSel(n.i); } }}>
            ${s === "now" && html`<circle class="pulse" cx=${n.x} cy=${n.y} r="21" fill="var(--red)"/>`}
            <circle class="face" cx=${n.x} cy=${n.y} r="21" fill=${face} stroke=${sel === n.i ? "var(--ink)" : s === "next" ? "var(--red)" : "var(--border-strong)"} stroke-width=${sel === n.i ? 3 : 1.5}/>
            <g transform=${`translate(${n.x - 12} ${n.y - 12})`}><path d=${glyph[n.c]} fill="none" stroke=${ink} stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
            ${s === "locked" && html`<g transform=${`translate(${n.x + 9} ${n.y + 8})`}><circle cx="5" cy="5" r="7.5" fill="var(--surface)" stroke="var(--border-strong)"/><rect x="2" y="4.5" width="6" height="4.5" rx="1" fill="var(--ink-faint)"/><path d="M3.3 4.5V3.4a1.7 1.7 0 0 1 3.4 0v1.1" fill="none" stroke="var(--ink-faint)" stroke-width="1.1"/></g>`}
            ${s === "done" && html`<text x=${n.x} y=${n.y + 36} text-anchor="middle" class="jlbl" style=${{ fill:"var(--gold)" }}>CLEARED</text>`}
          </g>`;
        })}
      </svg>
    </section>
  </div>`;
}

  const list = useMemo(() => Object.entries(DRILL_LIB)
    .filter(([, d]) => filter === "all" || d.cat === filter)
    .filter(([n, d]) => { const s = (DRILL_NAMES[n] + " " + (d.purpose || "")).toLowerCase(); return !q || s.includes(q.toLowerCase()); })
    .map(([n, d]) => [Number(n), d])
    .sort((a, b) => a[0] - b[0]), [filter, q]);

  const filters = [["all", "All", DRILL_LIB], ...Object.entries(CATS).map(([k, v]) => [k, v.label, v.cls])];

  return html`<div class="screen">
    <section class="hero">
      <div class="eyebrow">Drill reference · ${list.length} of ${Object.keys(DRILL_LIB).length}</div>
      <h1>Library</h1>
      <p class="note" style=${{ margin:0 }}>Every drill in the 8-week block, with purpose, scientific basis, procedure, coaching points, common faults, progressions and safety notes. Numbers match the Drills Library in <i>The Coaching Crease</i>.</p>
      <input class="lib-search" type="search" placeholder="Search drills…" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Search drills"/>
      <div class="chips">${filters.map(([k, l]) => html`<button key=${k} class=${"chip " + (k === "all" ? "" : (CATS[k] || {}).cls || "")} aria-pressed=${filter === k ? "true" : "false"} onClick=${() => setFilter(k)}>${l}</button>`)}</div>
    </section>

    <div class="stack">
      ${list.length === 0 && html`<div class="empty">No drills match. Try a broader filter.</div>`}
      ${list.map(([n, d]) => {
        const cat = CATS[d.cat] || {};
        const isOpen = openId === n;
        return html`<details class=${"lcard fold " + cat.cls} key=${n} open=${isOpen} onToggle=${e => setOpenId(e.target.open ? n : (openId === n ? null : openId))}>
          <summary>
            <div style=${{ minWidth:0 }}>
              <div class="l-no">DRILL ${String(n).padStart(2,"0")} · ${cat.label}</div>
              <div class="l-name">${DRILL_NAMES[n]}</div>
              <div class="l-tags"><span>${d.age}</span><span>${d.grp}</span><span>${d.kit}</span><span>${d.dur}</span></div>
              ${d.purpose && html`<p class="note" style=${{ margin:"6px 0 0" }}>${d.purpose}</p>`}
            </div><${Chev}/>
          </summary>
          <div class="l-body">
            ${d.anim && html`<${ActionPlayer} spec=${ANIMS[d.anim]} onWatched=${st && st.watch}/>`}
            ${d.science && html`<div class="why"><div class="lbl">Why it works</div><div>${d.science}</div><${Cites} keys=${d.srcs}/></div>`}
            ${d.setup && html`<div class="l-sec"><div class="lbl">Set up</div><div>${d.setup}</div></div>`}
            ${d.steps && html`<div class="l-sec"><div class="lbl">Run it</div><ol>${d.steps.map((s, i) => html`<li key=${i}>${s}</li>`)}</ol></div>`}
            ${d.coach && html`<div class="l-sec"><div class="lbl">Coaching points</div><div>${d.coach}</div></div>`}
            ${d.faults && html`<div class="fault"><div class="lbl">Common faults</div><ul>${d.faults.map((f, i) => html`<li key=${i}>${f}</li>`)}</ul></div>`}
            ${(d.easier || d.harder) && html`<div class="prog-row">
              <div><div class="lbl">Easier</div>${d.easier || "—"}</div>
              <div><div class="lbl">Harder</div>${d.harder || "—"}</div>
            </div>`}
            ${d.safety && html`<div class="safe"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1 14 3v4c0 4-3 7-6 8-3-1-6-4-6-8V3z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v3M8 10.5v.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><div><b>Safety:</b> ${d.safety}</div></div>`}
            ${d.topics && html`<div class="l-sec"><div class="lbl">Syllabus topics</div><div class="ref">${d.topics.map((id, i) => html`<span key=${id}>${i ? " · " : ""}<b style=${{ fontWeight:500, color:"var(--ink-soft)" }}>${T(id)}</b> <span class="mono">${id}</span></span>`)}</div></div>`}
          </div>
        </details>`;
      })}
    </div>
  </div>`;
}

/* ---------- syllabus (straight from the JSON) ---------- */
function Syllabus({ data, byId }){
  const usage = useMemo(() => {
    const u = {};
    const add = (id, n) => { (u[id] = u[id] || new Set()).add(n); };
    WEEKS.forEach(w => { [...w.bat.topics, ...w.field.topics, ...(w.also || [])].forEach(id => add(id, w.n)); });
    DAY1.blocks.forEach(b => (b.refs || []).forEach(id => add(id, 1)));
    DAY1.checklist.forEach(c => add(c.ref, 1));
    return u;
  }, []);
  const cov = ch => { const t = byId[ch].topics; return [t.filter(x => usage[x.id]).length, t.length]; };
  const [bu, bt] = cov("ch9"), [fu, ft] = cov("ch12");
  const kindOf = ch => ch.discipline === "batting" ? "bat" : ch.discipline === "fielding" ? "field" : "admin";

  return html`<div class="screen">
    <section>
      <div class="sec-head"><h2 class="sec">${data.meta.title}</h2></div>
      <p class="note" style=${{ margin:"-4px 0 12px" }}>Loaded live from <span class="mono">Cricket-Coaching-Syllabus.json</span> · v${data.meta.version} · ${data.meta.alignment}</p>
      <div class="cov">
        <div class="card k-bat"><div class="lbl">Batting topics</div><div class="big">${bu}<small>/${bt}</small></div><div class="meter"><i style=${{ width: bu/bt*100+"%" }}></i></div></div>
        <div class="card k-field"><div class="lbl">Fielding topics</div><div class="big">${fu}<small>/${ft}</small></div><div class="meter"><i style=${{ width: fu/ft*100+"%" }}></i></div></div>
      </div>
    </section>
    ${data.root.children.map(part => {
      const chapters = (part.children || []).filter(c => c.topics);
      const used = chapters.reduce((a, c) => a + c.topics.filter(t => usage[t.id]).length, 0);
      const cats = (part.children || []).filter(c => c.type === "drillCategory");
      return html`<details class="part fold" key=${part.id} open=${part.id === "p3"}>
        <summary><div><div class="eyebrow">${part.id.toUpperCase()}${part.totalDrills ? " · " + part.totalDrills + " drills" : ""}</div><div class="wk-title">${part.title}</div>${chapters.length > 0 && html`<div class="ref">${used} topic${used === 1 ? "" : "s"} used in this block</div>`}</div><${Chev}/></summary>
        <div class="part-in">
          ${chapters.map(ch => html`<div key=${ch.id} class=${"k-" + kindOf(ch)}>
            <div class="chap-t">${ch.title}<span class="mono">${ch.id}</span></div>
            <ul class="topics">${ch.topics.map(t => html`<li key=${t.id} class=${usage[t.id] ? "used" : ""}>
              <span>${t.title}</span>${usage[t.id] && html`<span class="wkchips">${[...usage[t.id]].sort((a,b)=>a-b).map(n => html`<span key=${n}>W${n}</span>`)}</span>`}
            </li>`)}</ul>
          </div>`)}
          ${cats.length > 0 && html`<ul class="topics">${cats.map(c => html`<li key=${c.id} class=${["batting","fielding","running","warm-up"].includes(c.discipline) ? "used k-field" : ""}><span>${c.title}</span><span class="mono faint" style=${{ fontSize:11.5 }}>#${c.drillNumbers}</span></li>`)}</ul>`}
        </div>
      </details>`;
    })}
  </div>`;
}

/* ---------- app ---------- */
function App(){
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [role, setRole] = useStored("role", "coach");
  const [tab, setTab] = useStored("tab", "today");
  const st = useStudent();
  const [clip, setClip] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [lvlUp, setLvlUp] = useState(null);
  const prev = useRef(null);

  useEffect(() => {
    fetch(SYLLABUS_URL).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(setData).catch(e => setErr(String(e)));
  }, []);
  const byId = useMemo(() => data ? indexSyllabus(data) : {}, [data]);
  const T = id => (byId[id] && byId[id].title) || id;
  useEffect(() => { window.scrollTo(0, 0); }, [tab, role]);

  /* XP pops, badge unlocks and level-ups */
  useEffect(() => {
    const cur = { xp: st.xp, level: st.level, badges: st.badges.filter(b => b.on).map(b => b.id) };
    const p = prev.current; prev.current = cur;
    if (!p) return;
    const add = [];
    if (cur.xp > p.xp) add.push({ id: Math.random(), kind: "xp", text: "+" + (cur.xp - p.xp) });
    cur.badges.filter(b => !p.badges.includes(b)).forEach(b => add.push({ id: Math.random(), kind: "badge", text: BADGES.find(x => x.id === b).name }));
    if (add.length){
      setToasts(ts => [...ts, ...add]);
      add.forEach(a => setTimeout(() => setToasts(ts => ts.filter(x => x.id !== a.id)), a.kind === "badge" ? 2900 : 1800));
    }
    if (cur.level > p.level) setLvlUp(cur.level);
  }, [st.xp]);

  const coachTabs = ["today", "program", "library", "syllabus"];
  const studentTabs = ["today", "program", "library", "trophies"];
  const allowed = role === "coach" ? coachTabs : studentTabs;
  const t = allowed.includes(tab) ? tab : "today";
  let body;
  if (err) body = html`<div class="state">Couldn't load <code>Cricket-Coaching-Syllabus.json</code> (${err}).<br/><br/>Serve this folder over HTTP, for example <code>python -m http.server</code>, and open the page from there. Browsers block file:// fetches.</div>`;
  else if (!data) body = html`<div class="state">Loading the syllabus…</div>`;
  else if (t === "library") body = html`<${DrillLibrary} T=${T} openClip=${setClip} st=${role === "student" ? st : null}/>`;
  else if (role === "coach") body = t === "program" ? html`<${Program} T=${T} role=${role} goToday=${() => setTab("today")}/>`
    : t === "syllabus" ? html`<${Syllabus} data=${data} byId=${byId}/>` : html`<${CoachToday} T=${T}/>`;
  else body = t === "program" ? html`<${Journey} st=${st} goToday=${() => setTab("today")}/>`
    : t === "trophies" ? html`<${Trophies} st=${st}/>` : html`<${StudentToday} st=${st} T=${T} openClip=${setClip}/>`;

  const tabs = role === "coach"
    ? [["today", "Session", "today"], ["program", "Program", "program"], ["library", "Library", "library"], ["syllabus", "Syllabus", "syllabus"]]
    : [["today", "Today", "today"], ["program", "Journey", "journey"], ["library", "Library", "library"], ["trophies", "Trophies", "trophies"]];
  return html`<div class="app">
    <header class="top">
      <div class="top-row">
        <div class="brand"><${Ball}/><div><b>InstilPlay</b><small>${role === "coach" ? "Coach · Coach Rao" : `Student · Aarav S. · Lv ${st.level} · ${st.xp} XP`}</small></div></div>
        <div class="seg" role="group" aria-label="View as">
          ${[["coach","Coach"],["student","Student"]].map(([k, l]) => html`<button key=${k} aria-pressed=${role === k ? "true" : "false"} onClick=${() => setRole(k)}>${l}</button>`)}
        </div>
      </div>
    </header>
    <main>${body}</main>
    <nav class="nav n4" aria-label="Sections">
      ${tabs.map(([k, l, ic]) => html`<button key=${k} aria-current=${t === k ? "page" : undefined} onClick=${() => setTab(k)}><${NavIcon} name=${ic}/>${l}</button>`)}
    </nav>
    <div class="toasts" aria-live="polite">${toasts.map(x => html`<div key=${x.id} class=${"toast" + (x.kind === "badge" ? " bt" : "")}>${x.kind === "xp" ? html`<b>${x.text}</b> XP` : html`Badge unlocked: ${x.text}`}</div>`)}</div>
    ${clip && html`<${ClipSheet} id=${clip} st=${st} onClose=${() => setClip(null)}/>`}
    ${lvlUp && html`<div class="overlay" onClick=${() => setLvlUp(null)}>
      <div class="lvlup" role="dialog" aria-modal="true" aria-label="Level up" onClick=${e => e.stopPropagation()}>
        <div class="confetti" aria-hidden="true">${Array.from({ length: 28 }, (_, i) => html`<i key=${i} style=${{ left: (i * 37 % 100) + "%", background: ["var(--red)","var(--gold)","var(--green)","var(--blue)"][i % 4], animationDelay: (i % 7) * .08 + "s" }}></i>`)}</div>
        <${LevelBadge} n=${lvlUp}/>
        <div class="eyebrow">Level up</div>
        <h3>${LEVELS[lvlUp - 1][1]}</h3>
        <p>You reached Level ${lvlUp}. Keep clearing blocks and quests.</p>
        <button class="btn" onClick=${() => setLvlUp(null)}>Keep going</button>
      </div>
    </div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
